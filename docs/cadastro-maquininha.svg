<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1700" viewBox="0 0 1000 1700">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { fill: #151D1A; font-size: 28px; font-weight: 700; }
    .phone-title { fill: #FFFFFF; font-size: 22px; font-weight: 700; }
    .label { fill: #0C3829; font-size: 15px; font-weight: 700; }
    .body { fill: #151D1A; font-size: 14px; }
    .muted { fill: #62716C; font-size: 12px; }
    .small { fill: #62716C; font-size: 11px; }
    .button { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
    .field { fill: #F0F4F2; stroke: #D6DFDC; stroke-width: 1.5; }
    .card { fill: #FFFFFF; stroke: #D6DFDC; stroke-width: 1.5; }
    .chip-off { fill: #F0F4F2; stroke: #D6DFDC; stroke-width: 1.5; }
    .chip-on { fill: #0C3829; }
    .chip-text-off { fill: #0C3829; font-size: 13px; font-weight: 700; }
    .chip-text-on { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
  </style>
  <rect width="1000" height="1700" fill="#D9DCDA"/>
  <text x="60" y="60" class="title">Cadastro da maquininha — tarifa é input numérico, bandeira é chip de vínculo</text>
  <text x="60" y="88" class="muted" font-size="14">Bandeiras cadastradas manualmente (nomes sempre em MAIÚSCULO). O chip só vincula a bandeira; a tarifa (%) é digitada em um campo numérico por bandeira/parcela.</text>

  <g transform="translate(60 130)">
    <rect width="880" height="1510" rx="30" fill="#F4F6F5"/>
    <path d="M0 30Q0 0 30 0H850Q880 0 880 30V110H0Z" fill="#0C3829"/>
    <text x="36" y="66" fill="#FFFFFF" font-size="32">‹</text>
    <text x="80" y="66" class="phone-title">Nova maquininha</text>

    <rect x="24" y="130" width="832" height="1356" rx="24" fill="#FFFFFF"/>

    <!-- Nome -->
    <text x="48" y="168" class="label">Nome da maquininha *</text>
    <rect x="48" y="180" width="784" height="46" rx="10" class="field"/>
    <text x="66" y="209" class="body">Ton T3</text>

    <!-- Tipos de pagamento -->
    <text x="48" y="262" class="label">Tipos de pagamento (chips, multisseleção) *</text>
    <rect x="48" y="276" width="150" height="42" rx="21" class="chip-off"/>
    <text x="90" y="302" class="chip-text-off">DINHEIRO</text>
    <rect x="210" y="276" width="100" height="42" rx="21" class="chip-off"/>
    <text x="243" y="302" class="chip-text-off">PIX</text>
    <rect x="322" y="276" width="140" height="42" rx="21" class="chip-on"/>
    <text x="358" y="302" class="chip-text-on">DÉBITO</text>
    <rect x="474" y="276" width="150" height="42" rx="21" class="chip-on"/>
    <text x="507" y="302" class="chip-text-on">CRÉDITO</text>
    <text x="48" y="340" class="small">Chip selecionado revela as opções dependentes abaixo.</text>

    <line x1="48" y1="362" x2="832" y2="362" stroke="#D6DFDC"/>

    <!-- DEBITO -->
    <text x="48" y="398" class="label">Débito — bandeiras vinculadas (chips)</text>
    <rect x="48" y="412" width="140" height="42" rx="21" class="chip-on"/>
    <text x="80" y="438" class="chip-text-on">VISA</text>
    <rect x="200" y="412" width="170" height="42" rx="21" class="chip-on"/>
    <text x="232" y="438" class="chip-text-on">MASTER</text>
    <rect x="382" y="412" width="140" height="42" rx="21" class="chip-off"/>
    <text x="418" y="438" class="chip-text-off">ELO</text>
    <text x="48" y="480" class="small">Cada bandeira marcada acima ganha seu próprio campo de tarifa (input numérico), não um chip de valor.</text>

    <!-- card VISA debito -->
    <rect x="48" y="498" width="784" height="78" rx="16" class="card"/>
    <rect x="68" y="516" width="78" height="42" rx="10" fill="#E5F4ED"/>
    <text x="80" y="542" class="label" font-size="12">VISA</text>
    <text x="48" y="498" class="label" font-size="0"/>
    <text x="170" y="530" class="label">Tarifa débito (%) *</text>
    <rect x="170" y="540" width="190" height="40" rx="10" class="field"/>
    <text x="188" y="565" class="body">1,89</text>
    <text x="380" y="530" class="label">Início da vigência *</text>
    <rect x="380" y="540" width="190" height="40" rx="10" class="field"/>
    <text x="398" y="565" class="body">01/10/2026</text>

    <!-- card MASTER debito -->
    <rect x="48" y="588" width="784" height="78" rx="16" class="card"/>
    <rect x="68" y="606" width="78" height="42" rx="10" fill="#E5F4ED"/>
    <text x="78" y="632" class="label" font-size="11">MASTER</text>
    <text x="170" y="620" class="label">Tarifa débito (%) *</text>
    <rect x="170" y="630" width="190" height="40" rx="10" class="field"/>
    <text x="188" y="655" class="body">2,10</text>
    <text x="380" y="620" class="label">Início da vigência *</text>
    <rect x="380" y="630" width="190" height="40" rx="10" class="field"/>
    <text x="398" y="655" class="body">01/10/2026</text>
    <text x="48" y="692" class="small">Ex.: MASTER pode ter tarifa diferente de VISA porque cada bandeira tem seu próprio input.</text>

    <line x1="48" y1="714" x2="832" y2="714" stroke="#D6DFDC"/>

    <!-- CREDITO -->
    <text x="48" y="750" class="label">Crédito — bandeiras vinculadas (chips)</text>
    <rect x="48" y="764" width="140" height="42" rx="21" class="chip-on"/>
    <text x="80" y="790" class="chip-text-on">VISA</text>
    <rect x="200" y="764" width="170" height="42" rx="21" class="chip-off"/>
    <text x="232" y="790" class="chip-text-off">MASTER</text>
    <rect x="382" y="764" width="140" height="42" rx="21" class="chip-off"/>
    <text x="418" y="790" class="chip-text-off">ELO</text>

    <text x="48" y="836" class="muted">VISA selecionada → chips de parcela (sem faixa, cada parcela individual):</text>
    <g font-size="13" font-weight="700">
      <rect x="48" y="850" width="62" height="38" rx="19" class="chip-on"/><text x="63" y="874" class="chip-text-on">1x</text>
      <rect x="118" y="850" width="62" height="38" rx="19" class="chip-on"/><text x="133" y="874" class="chip-text-on">2x</text>
      <rect x="188" y="850" width="62" height="38" rx="19" class="chip-off"/><text x="204" y="874" class="chip-text-off">3x</text>
      <rect x="258" y="850" width="62" height="38" rx="19" class="chip-off"/><text x="274" y="874" class="chip-text-off">4x</text>
      <rect x="328" y="850" width="70" height="38" rx="19" class="chip-off"/><text x="340" y="874" class="chip-text-off">…12x</text>
    </g>
    <text x="48" y="908" class="small">Cada parcela marcada (1x, 2x…) ganha seu próprio input de tarifa — nunca o chip carrega o valor.</text>

    <!-- card VISA 1x -->
    <rect x="48" y="926" width="784" height="78" rx="16" class="card"/>
    <rect x="68" y="944" width="78" height="42" rx="10" fill="#E5F4ED"/>
    <text x="80" y="970" class="label" font-size="12">VISA</text>
    <text x="170" y="958" class="label">Crédito 1x — tarifa (%) *</text>
    <rect x="170" y="968" width="190" height="40" rx="10" class="field"/>
    <text x="188" y="993" class="body">2,49</text>
    <text x="380" y="958" class="label">Início da vigência *</text>
    <rect x="380" y="968" width="190" height="40" rx="10" class="field"/>
    <text x="398" y="993" class="body">01/10/2026</text>

    <!-- card VISA 2x -->
    <rect x="48" y="1016" width="784" height="78" rx="16" class="card"/>
    <rect x="68" y="1034" width="78" height="42" rx="10" fill="#E5F4ED"/>
    <text x="80" y="1060" class="label" font-size="12">VISA</text>
    <text x="170" y="1048" class="label">Crédito 2x — tarifa (%) *</text>
    <rect x="170" y="1058" width="190" height="40" rx="10" class="field"/>
    <text x="188" y="1083" class="body">3,09</text>
    <text x="380" y="1048" class="label">Início da vigência *</text>
    <rect x="380" y="1058" width="190" height="40" rx="10" class="field"/>
    <text x="398" y="1083" class="body">01/10/2026</text>

    <line x1="48" y1="1118" x2="832" y2="1118" stroke="#D6DFDC"/>

    <!-- resumo -->
    <rect x="48" y="1138" width="784" height="130" rx="18" fill="#E5F4ED"/>
    <text x="72" y="1170" class="label">Resumo do vínculo (exemplo do enunciado)</text>
    <text x="72" y="1196" class="body">• Chip VISA/MASTER/ELO → só define QUAIS bandeiras valem para este tipo/parcela.</text>
    <text x="72" y="1218" class="body">• Campo numérico (%) → define o VALOR da tarifa, individual por bandeira/parcela.</text>
    <text x="72" y="1240" class="body">• Assim dá para ter uma tarifa para MASTER e outra para as demais bandeiras.</text>

    <rect x="48" y="1296" width="784" height="50" rx="12" fill="#0C3829"/>
    <text x="340" y="1328" class="button">SALVAR MAQUININHA</text>
    <text x="48" y="1382" class="small">Nomes de bandeira sempre em MAIÚSCULO (ex.: VISA, MASTER, ELO), cadastrados previamente em</text>
    <text x="48" y="1399" class="small">Configurações → Bandeiras. A tarifa alterada aqui cria um novo registro (histórico imutável).</text>
  </g>
</svg>
